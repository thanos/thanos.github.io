summary: >
  Trade-feed framework that collected, filtered, and processed energy deals
  into JPMorgan’s Athena Python analytics platform, plus CME and ICE FIX
  gateways, reconciliation, profiling, and a shared alerting stack.
bullets:
  - Built a C/Python trade-feed framework that collected, filtered, and processed deals, then booked them into Athena.
  - Implemented a CME FIX gateway to the Athena trade feed for energy deals on that framework (Python).
  - Enhanced an existing ICE-to-Athena FIX trade feed for energy deals (Java, Python).
  - Built reconciliation toolsets for the CME and ICE feeds.
  - Wrote a WxWindows/Python code profiler for performance and memory issues on the Athena stack.
  - Delivered an alert and logging framework for all energy feeds, combining the useful parts of Nagios and Big Brother.
  - Built additional tools to process and manage deals, events, and portfolios.
