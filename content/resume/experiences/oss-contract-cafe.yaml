summary: On-chain contract cafe — abstract betting/outcome ledgers in Solidity and Vyper with cafe fees,
  odds, and payout.
bullets:
- 'Designed and built Contract Cafe for Byteeasy: Ethereum ledgers where a cafe hosts outcome books, ledger
  owners cover risk, and punters stake against event outcomes.'
- Solidity abstract Ledger (bet, odds, 4% cafe cut, event processing, payout/selfdestruct) plus sample
  HeadsOrTailsLedger; parallel Vyper outcome_leger with the same model.
- Truffle/Brownie test suites for bets, wins, payouts, and multi-punter cases; dual Solidity and Vyper
  implementations of the cafe protocol.
