summary: >
  Set up and managed ICAP’s in-house front-end development team in New York
  for the BrokerTec fixed-income trading system: the mainstream Java/Swing
  app with Random Walk, iConnect conversion, a sub-10 MB emerging-markets
  web client, a config-driven GUI framework (six-week front-end), BlackBerry
  proof-of-concept trading, Jabber/async-j backend services, and Python
  market-conformance tools.
bullets:
  - "BrokerTec fixed-income trading app (Java/Swing, C++), with Random Walk: Java 1.4→1.5 migration; joystick trading, quick order-entry windows, net-position and P&L tables, batch/bulk order management, and anonymous workup."
  - Converted the main trading platform to iConnect (Java, SWIG, C++).
  - "BrokerTec lightweight emerging-markets trading app (Java, visualt, AJAX): web client for actives, repos, CDs, and mortgages on a non-Swing GUI, running under 10 MB."
  - "Lightweight GUI framework for trading systems (Java): screens, menus, panels, dialogs, columns, and instruments specified in config and laid out dynamically so new UI could ship without changing existing code; used to deliver a trading front-end in six weeks."
  - "BrokerTec/BlackBerry fixed-income trading (C++, WebSphere, J2EE): Spartan but fully functional real-time, benchmarks-only handheld proof of concept."
  - "Distributed trading backend services (Java, async-j, NIO, Jabber): non-threaded, high-performance read-only and position-management fan-out so hundreds of clients could share one guest account against BrokerTec services, improving performance and security."
  - Designed market-conformance analysis and monitoring tools (Python, iLabs, WxWindows).
